
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyBuddy | Your Study Partner</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6fb;
    color: #222;
}

header {
    background: #5146d8;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    font-size: 30px;
}

.container {
    max-width: 1000px;
    margin: 25px auto;
    padding: 15px;
}

.welcome {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px #ddd;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 3px 12px #ddd;
}

.card h2 {
    color: #5146d8;
    margin-bottom: 15px;
}

input, textarea {
    width: 100%;
    padding: 11px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
}

button {
    background: #5146d8;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 7px;
}

button:hover {
    background: #352bb0;
}

ul {
    margin: 12px 0 0 20px;
}

li {
    margin: 8px 0;
    overflow-wrap: anywhere;
}

.timer {
    font-size: 35px;
    font-weight: bold;
    text-align: center;
    margin: 15px;
    color: #5146d8;
}

footer {
    text-align: center;
    padding: 20px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>📚 StudyBuddy</h1>
    <p>Your Smart Study Partner</p>
</header>

<div class="container">

    <section class="welcome">
        <h2>Welcome to StudyBuddy! 👋</h2>
        <p>Plan your studies, stay focused and achieve your goals.</p>
    </section>

    <div class="cards">

        <section class="card">
            <h2>📝 To-Do List</h2>
            <input id="taskInput" placeholder="Enter your task">
            <button onclick="addTask()">Add Task</button>
            <ul id="taskList"></ul>
        </section>

        <section class="card">
            <h2>⏱️ Study Timer</h2>
            <div class="timer" id="timer">25:00</div>
            <button onclick="startTimer()">Start</button>
            <button onclick="pauseTimer()">Pause</button>
            <button onclick="resetTimer()">Reset</button>
        </section>

        <section class="card">
            <h2>📖 Study Notes</h2>
            <textarea id="notes" rows="5"
                placeholder="Write your study notes here..."></textarea>
            <button onclick="saveNotes()">Save Notes</button>
            <p id="savedMessage"></p>
        </section>

        <section class="card">
            <h2>🎯 Daily Goal</h2>
            <input id="goalInput"
                placeholder="Enter your daily study goal">
            <button onclick="saveGoal()">Save Goal</button>
            <p id="goalDisplay"></p>
        </section>

    </div>
</div>

<footer>
    <p>© 2026 StudyBuddy | Learn Better, Grow Smarter 🚀</p>
</footer>

<script>

// TO-DO LIST
function addTask() {
    const input = document.getElementById("taskInput");
    const task = input.value.trim();

    if (task === "") {
        alert("Please enter a task!");
        return;
    }

    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = task + " ";
    
    const done = document.createElement("button");
    done.textContent = "Done";
    done.onclick = function() {
        li.style.textDecoration = "line-through";
    };

    const remove = document.createElement("button");
    remove.textContent = "Delete";
    remove.onclick = function() {
        li.remove();
    };

    li.append(span, done, remove);
    document.getElementById("taskList").appendChild(li);
    input.value = "";
}

// STUDY TIMER
let seconds = 1500;
let interval = null;

function updateTimer() {
    let min = Math.floor(seconds / 60);
    let sec = seconds % 60;

    document.getElementById("timer").textContent =
        String(min).padStart(2, "0") + ":" +
        String(sec).padStart(2, "0");
}

function startTimer() {
    if (interval !== null) return;

    interval = setInterval(function() {
        if (seconds > 0) {
            seconds--;
            updateTimer();
        } else {
            pauseTimer();
            alert("Great job! Study session completed 🎉");
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(interval);
    interval = null;
}

function resetTimer() {
    pauseTimer();
    seconds = 1500;
    updateTimer();
}

// NOTES
document.getElementById("notes").value =
    localStorage.getItem("studyNotes") || "";

function saveNotes() {
    const notes = document.getElementById("notes").value;
    localStorage.setItem("studyNotes", notes);
    document.getElementById("savedMessage").textContent =
        "Notes saved successfully! ✅";
}

// DAILY GOAL
document.getElementById("goalDisplay").textContent =
    localStorage.getItem("studyGoal") || "No goal set yet.";

function saveGoal() {
    const goal = document.getElementById("goalInput").value.trim();

    if (!goal) {
        alert("Please enter a goal!");
        return;
    }

    localStorage.setItem("studyGoal", goal);
    document.getElementById("goalDisplay").textContent = goal;
    document.getElementById("goalInput").value = "";
}

updateTimer();

</script>

</body>
</html>
